# Все параметры пайплайна; целиком попадают в manifest.json.
# Переопределение из CLI: --set section.key=value  (например --set episode.confidence_threshold=0.6)

video:
  target_fps: 10.0          # частота анализа, остальные кадры пропускаются
  fallback_fps: 25.0        # если в контейнере нет корректного FPS

detector:
  pose_model: weights/yolo11m-pose.pt   # скачивается автоматически; точнее — yolo11x-pose.pt
  imgsz: 1280               # CCTV: люди мелкие, поэтому вход больше стандартных 640
  conf: 0.1                 # низкий порог: ByteTrack использует слабые детекции во втором проходе
  iou: 0.6
  tracker: configs/bytetrack_cctv.yaml
  device: auto              # auto | cpu | mps | 0
  half: false               # true только для CUDA
  refine_small: true        # повторная поза на увеличенном кропе для мелких людей
  refine_max_height: 220    # px, ниже — уточняем
  refine_imgsz: 320
  refine_pad: 0.15

tracking:
  min_person_height: 72     # по правилам 80px; запас вниз почти не штрафуется (такие интервалы — IGNORE)
  roi_anchor: feet          # feet | center | head — точка человека, которая должна быть в зоне
  stitch_max_gap: 2.0       # с, склейка оборванных треков
  stitch_max_dist: 0.6      # расстояние центров, в высотах bbox

geometry:
  min_kpt_conf: 0.3
  hand_extrapolation: 0.3   # кисть = запястье + k * (запястье - локоть)
  scale_bbox_ratio: 0.12    # нормировка = max(ширина плеч, k * высота bbox)
  scale_window: 2.0         # с, скользящая медиана нормировки
  smooth_window: 3          # отсчётов, медианное сглаживание d(t)

cycle:
  near_enter: 0.6           # d ниже — кисть у рта (d в единицах нормировки)
  near_exit: 0.9            # d выше — кисть отведена (гистерезис)
  min_hold: 0.4             # с; по правилам ~0.5 с, с допуском на дискретизацию
  max_hold: 6.0             # с; по правилам ~5 с
  max_missing: 0.6          # с пропуска точек, допустимые внутри паузы
  lookaround: 2.0           # с до/после паузы для поиска фаз подхода и отвода
  phone_ear_ratio: 0.75     # d(кисть, ухо) / d(кисть, рот) ниже — похоже на телефон у уха
  min_wrist_above_elbow: 0.5  # доля кадров паузы, где запястье выше локтя
  max_wrist_above_mouth: 0.1  # запястье выше рта больше чем на k*scale — рука у головы, не у рта
  max_elbow_raise: 0.15     # локоть выше плеча больше чем на k*scale — рука у головы
  min_face_visible: 0.5     # доля кадров паузы с уверенно найденным носом (иначе рот ненадёжен)

verifier:
  enabled: true
  model: weights/yolov8s-worldv2.pt     # open-vocabulary (YOLO-World / YOLOE)
  fallback_model: weights/yolo11s.pt    # COCO-детектор, если open-vocab недоступен
  imgsz: 640
  conf: 0.12
  frames_per_cycle: 6       # кадров на цикл, равномерно по паузе
  crop_margin: 0.9          # поле вокруг рта и кисти, в единицах нормировки
  wide_crop_margin: 2.0     # второй, широкий кроп: банки и бутылки узкий обрезает; 0 — отключить
  positive_classes: [cigarette, vape, electronic cigarette, smoke, vapor cloud]
  negative_classes: [bottle, water bottle, cup, mug, drinking glass, beverage can, can, jar,
                     glass jar, thermos, cell phone, sandwich, food, spoon, fork]
  weak_negative_classes: [cell phone]   # часто срабатывает на саму кисть: не бывает сильным негативом
  direct_min_frames: 2      # прямой признак: предмет в нескольких соседних кадрах
  negative_min_fraction: 0.5  # доля кадров с «чужим» предметом (без позитивного), чтобы отбросить цикл
  strong_negative_conf: 0.25  # сильный негатив: один предмет с такой уверенностью...
  strong_negative_frames: 2   # ...минимум в стольких кадрах цикла отбрасывает цикл
  # «двойники» сигареты ищутся по всему треку, а не только в паузах: палочку чупа-чупса детектор
  # в паузе принимает за сигарету, а конфета хорошо видна в руке или у рта между циклами.
  # «lollipop stick» / «candy on a stick» не годятся — срабатывают на настоящие сигареты
  track_negative_classes: [lollipop]
  track_scan_step: 0.5        # с между просматриваемыми кадрами трека; 0 — отключить
  track_negative_conf: 0.5    # уверенность находки (на настоящих сигаретах lollipop <= 0.45, в единичных кадрах)
  track_negative_radius: 1.0  # центр предмета не дальше от кисти или рта, в единицах нормировки
  track_negative_frames: 3    # столько кадров с находкой в окне вокруг цикла отбрасывают цикл
  track_negative_window: 60.0 # с, окно вокруг пика цикла; 0 — весь трек

flash:                      # вспышка зажигалки у рта: свет считается в проходе трекера (smokedet/flash.py)
  enabled: true
  min_area: 0.8             # новый пересвет у рта/кистей (нет в фоне), в единицах scale^2
  max_ring: 0.6             # пересвет вокруг человека выше — светлеет окружение (дверь, фары)
  max_hand_dist: 1.5        # кисть не дальше от рта, в единицах нормировки
  min_samples: 2            # отсчётов подряд: одиночный кадр — блик
  max_gap: 0.35             # с между отсчётами одной вспышки
  attach_before: 2.0        # с: цикл может начаться раньше вспышки на столько...
  attach_after: 10.0        # ...или позже её на столько (прикуривание → затяжка)

episode:
  window: 20.0              # с: два полных цикла в пределах 20 с
  min_cycles: 2
  merge_gap: 15.0           # с: циклы одного человека объединяются при паузе <= 15 с
  confidence_threshold: 0.5 # подбирается на эталонном наборе (tune.py) и фиксируется до раскрытия разметки
  cycle_weight: 0.45        # вклад одного идеального цикла в confidence
  evidence_weight: 0.6      # вклад прямого признака
  evidence_conf_ref: 0.4    # уверенность верификатора, считающаяся «полной»
  negative_penalty: 0.5     # штраф за «чужие» предметы
  event_negative_fraction: 0.5  # «чужой» предмет в такой доле циклов (без прямого признака) отклоняет событие
  flash_as_direct: true     # вспышка зажигалки — прямой признак (1 цикл + вспышка = эпизод); false — только confidence
  flash_evidence: 1.0       # вклад вспышки в confidence, доля от полного прямого признака

report:
  team: ""
  model_version: smokedet-0.1.0
  data_sources:
    - COCO (предобучение YOLO11-pose, Ultralytics)
    - Objects365/GoldG (предобучение YOLO-World, Ultralytics)
    - Эталонный набор организатора — только подбор порогов
  fine_tuning: "нет: используются предобученные веса, на данных объекта подбираются только пороги"
  notes: ""
